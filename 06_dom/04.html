<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: white">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlanguage(language){
        const ul = document.querySelector('.language')
        const li = document.createElement('li');

        li.textContent = language; //Method1
        // li.appendChild(document.createTextNode(language)); //Method2 - more optimized
        ul.appendChild(li);
    }

    const arr = ['Python', 'Java', 'C++', 'PHP'];
    for(let i=0; i<arr.length; i++){
        addlanguage(arr[i]);
    }

    //Edit the DOM
    const secondlang = document.querySelector('.language li:nth-child(2)');
    secondlang.textContent = 'C#'; //Method1


    const newlang = document.createElement('li');
    newlang.textContent = 'Ruby';
    secondlang.replaceWith(newlang); //Method2 -- optimized


    const thirdlang = document.querySelector('.language li:nth-child(3)');
    thirdlang.outerHTML = '<li>Go</li>'; //Method3 -- optimized

    //Delete the DOM
    const lastlang = document.querySelector('.language li:last-child');
    lastlang.remove(); //Method1
</script>
</html>
